name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Allow the results step to commit the updated README back to main.
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (backend + frontend)
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (server + web bundle + CSS)
        run: npm run build

      # Publish live test results into the README on pushes to main. Runs even
      # if a prior step failed, so a red result is recorded too. The commit is
      # tagged [skip ci] so it doesn't re-trigger CI or a deploy.
      - name: Publish test results to README
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/update-readme-tests.mjs

      - name: Commit README if changed
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update test results [skip ci]"
            git push
          fi
