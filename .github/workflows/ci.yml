name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Allow the results step to commit the updated README back to main.
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check application and tests
        run: npm run typecheck

      - name: Build (server + web bundle + CSS)
        run: npm run build

      - name: Run all tests and generate report
        id: full-tests
        continue-on-error: true
        run: npm run test:report:ci

      - name: Add test report to job summary
        if: ${{ always() }}
        run: |
          if [ -f test-results/test-report.md ]; then
            cat test-results/test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-report
          path: |
            test-results/test-report.html
            test-results/test-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser debug artifacts on failure
        if: ${{ steps.full-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-artifacts
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      # Publish live test results into the README on pushes to main. Runs even
      # if a prior step failed, so a red result is recorded too. The commit is
      # tagged [skip ci] so it doesn't re-trigger CI or a deploy.
      - name: Publish test results to README
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/update-readme-tests.mjs

      - name: Commit README if changed
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update test results [skip ci]"
            git push
          fi

      - name: Enforce test result
        if: ${{ steps.full-tests.outcome == 'failure' }}
        run: exit 1
