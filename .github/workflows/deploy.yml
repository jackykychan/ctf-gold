name: Deploy

on:
  push:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab — deploy any branch on demand,
  # no merge required.
  workflow_dispatch:

# One deploy at a time; let a newer push supersede an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on a green build.
      - run: npm run typecheck
      - run: npm test

      # Build the frontend bundle + CSS into public/ (wrangler uploads it as assets).
      - run: npm run build:web && npm run build:css

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ctf-gold --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
